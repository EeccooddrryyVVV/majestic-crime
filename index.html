<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Majestic RP — Крайм Памятка Семьи</title>
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0a0b0e;
      --bg-card: #12141c;
      --bg-card-hover: #181b26;
      --bg-input: #1a1d2b;
      --border-color: #262a3d;
      --accent-red: #ff3b30;
      --accent-red-glow: rgba(255, 59, 48, 0.25);
      --accent-gold: #ffcc00;
      --accent-gold-glow: rgba(255, 204, 0, 0.2);
      --text-main: #f0f2f8;
      --text-muted: #8c93a8;
      --text-dim: #5c6275;
      --success: #34c759;
      --radius: 12px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 59, 48, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 204, 0, 0.03) 0%, transparent 40%);
    }

    /* Header & Navigation */
    header {
      background: rgba(18, 20, 28, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.8rem 1.5rem;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--accent-red), #990000);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      box-shadow: 0 0 12px var(--accent-red-glow);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--bg-input);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-dim);
    }

    .status-dot.online {
      background-color: var(--success);
      box-shadow: 0 0 8px rgba(52, 199, 89, 0.5);
    }

    .admin-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .admin-btn:hover {
      border-color: var(--accent-red);
      background: var(--bg-card-hover);
      box-shadow: 0 0 10px var(--accent-red-glow);
    }

    /* Container */
    .container {
      max-width: 1200px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
      flex: 1;
    }

    /* Search Bar Header */
    .search-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .search-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-gold);
    }

    .search-input-wrapper {
      position: relative;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 2.8rem;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 15px var(--accent-red-glow);
    }

    /* Categories Tabs */
    .categories {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .category-tab {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 500;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .category-tab:hover, .category-tab.active {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
      box-shadow: 0 0 10px var(--accent-red-glow);
    }

    /* Accordion List */
    .accordion-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .accordion-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      transition: var(--transition);
    }

    .accordion-item:hover {
      border-color: rgba(255, 59, 48, 0.4);
    }

    .accordion-header {
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      background: var(--bg-card);
    }

    .accordion-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .accordion-icon {
      font-size: 1.3rem;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-input);
      border-radius: 8px;
    }

    .accordion-title {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .accordion-arrow {
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }

    .accordion-item.open .accordion-arrow {
      transform: rotate(180deg);
      color: var(--accent-red);
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s ease;
      background: rgba(10, 11, 14, 0.5);
      border-top: 1px solid transparent;
    }

    .accordion-item.open .accordion-content {
      padding: 1.5rem;
      border-top-color: var(--border-color);
      max-height: 2000px;
    }

    .content-body {
      white-space: pre-wrap;
      color: var(--text-main);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    /* Copy Button */
    .copy-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .copy-btn:hover {
      color: #fff;
      border-color: var(--accent-gold);
    }

    /* Code Usage Tracking Logs in Article */
    .logs-container {
      margin-top: 1.5rem;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
    }

    .logs-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-color);
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-user { color: #5ac8fa; }
    .log-date { color: var(--text-dim); }

    /* Admin Panel Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 0.8rem;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }

    .form-control:focus {
      border-color: var(--accent-red);
    }

    textarea.form-control {
      min-height: 120px;
      resize: vertical;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent-red);
      color: #fff;
    }

    .btn-primary:hover {
      background: #e03126;
      box-shadow: 0 0 15px var(--accent-red-glow);
    }

    .btn-danger {
      background: rgba(255, 59, 48, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }

    .btn-danger:hover {
      background: var(--accent-red);
      color: #fff;
    }

    /* Table styling in articles */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
    }

    th {
      background: var(--bg-input);
      color: var(--accent-gold);
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-dim);
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
      margin-top: auto;
    }
  </style>
</head>

  <!-- Header -->

        <i class="fa-solid fa-skull-crossbones" style="color: var(--accent-red);"></i>

        </div>
      </div>
    </div>
  </div>

      "vzp_1": {

        title: "ВЗП (Война за Предприятия) & Капты",

      },
      "uk_1": {

        title: "Уголовный Кодекс & Сроки Demorgan",

      },
      "tencodes_1": {
        id: "tencodes_1",
        title: "Основные Тен-Коды и Сигналы",
        category: "tencodes",
        icon: "fa-radio",
        content: "10-4 — Принято / Понял\n10-20 — Мое местоположение (Локация)\n10-33 — Срочно требуется помощь / Нападение!\n10-99 — Ситуация урегулирована\nCODE 0 — Упал офицер / Требуется немедленный подкреп со всех ботов\nCODE 1 — Высокая опасность, стрельба на поражение",
        logs: []
      }
    };

    // ============================================================
    // 3. CORE APPLICATION FUNCTIONS
    // ============================================================

    // Load Data from Firebase Realtime DB
    function initDataListener() {
      if (!db) {
        articlesData = defaultArticles;
        renderArticles();
        return;
      }

      const articlesRef = db.ref("articles");
      articlesRef.on("value", (snapshot) => {
        const val = snapshot.val();
        if (val) {
          articlesData = val;
        } else {
          // If DB is empty, populate default articles
          articlesRef.set(defaultArticles);
          articlesData = defaultArticles;
        }
        renderArticles();
      });
    }

    // Render Articles based on Category & Search
    function renderArticles() {
      const container = document.getElementById('articlesList');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const activeCategory = document.querySelector('.category-tab.active').dataset.cat;

      container.innerHTML = '';

      let hasItems = false;

      Object.keys(articlesData).forEach(key => {
        const item = articlesData[key];
        
        // Category Filter
        if (activeCategory !== 'all' && item.category !== activeCategory) return;

        // Search Filter
        if (searchVal && !item.title.toLowerCase().includes(searchVal) && !item.content.toLowerCase().includes(searchVal)) return;

        hasItems = true;
        const card = document.createElement('div');
        card.className = 'accordion-item';
        card.id = `item-${item.id}`;

        let logsHTML = '';
        if (item.logs && item.logs.length > 0) {
          logsHTML = `
            <div class="logs-container">
              <div class="logs-title"><i class="fa-solid fa-clock-history"></i> Журнал активаций статьи:</div>
              ${item.logs.map(l => `
                <div class="log-item">
                  <span>Применил: <strong class="log-user">${escapeHtml(l.officer)}</strong> [${escapeHtml(l.target)}]</span>
                  <span class="log-date">${l.time}</span>
                </div>
              `).join('')}
            </div>
          `;
        }

        const editBtn = isAdmin ? `
          <button class="copy-btn" style="border-color: var(--accent-gold); color: var(--accent-gold);" onclick="event.stopPropagation(); openEditModal('${item.id}')">
            <i class="fa-solid fa-pen"></i> Редактировать
          </button>
        ` : '';

        card.innerHTML = `
          <div class="accordion-header" onclick="toggleAccordion('item-${item.id}')">
            <div class="accordion-title-group">
              <div class="accordion-icon"><i class="fa-solid ${item.icon || 'fa-file-lines'}"></i></div>
              <div class="accordion-title">${escapeHtml(item.title)}</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              ${editBtn}
              <i class="fa-solid fa-chevron-down accordion-arrow"></i>
            </div>
          </div>
          <div class="accordion-content">
            <div class="content-body">${escapeHtml(item.content)}</div>
            <button class="copy-btn" onclick="copyText(this, \`${escapeJsString(item.content)}\`)">
              <i class="fa-solid fa-copy"></i> Скопировать текст
            </button>
            ${logsHTML}
          </div>
        `;

        container.appendChild(card);
      });

      if (!hasItems) {
        container.innerHTML = `
          <div style="text-align:center; padding:3rem; color:var(--text-dim);">
            <i class="fa-solid fa-folder-open" style="font-size: 2.5rem; margin-bottom:1rem;"></i>
            <p>Ничего не найдено по данному запросу</p>
          </div>
        `;
      }
    }

    // Toggle Accordion State
    function toggleAccordion(id) {
      const el = document.getElementById(id);
      const isOpen = el.classList.contains('open');
      document.querySelectorAll('.accordion-item').forEach(item => item.classList.remove('open'));
      if (!isOpen) {
        el.classList.add('open');
      }
    }

    // Copying Utilities
    function copyText(btn, text) {
      navigator.clipboard.writeText(text);
      const originalText = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-check" style="color:var(--success);"></i> Скопировано!`;
      setTimeout(() => {
        btn.innerHTML = originalText;
      }, 2000);
    }

    // ============================================================
    // 4. ADMIN AUTHENTICATION & MODALS
    // ============================================================

    document.getElementById('openAdminBtn').addEventListener('click', () => {
      if (isAdmin) {
        openEditModal(null); // Open blank modal for creating
      } else {
        document.getElementById('authModal').classList.add('active');
      }
    });

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function authenticateAdmin() {
      const pass = document.getElementById('adminPassInput').value;
      if (pass === ADMIN_PASS) {
        isAdmin = true;
        document.getElementById('adminBtnLabel').innerText = "Добавить статью";
        document.getElementById('adminPassInput').value = '';
        closeModal('authModal');
        renderArticles();
        alert("Успешный вход в Админ-панель!");
      } else {
        alert("Неверный пароль доступа!");
      }
    }

    function openEditModal(articleId) {
      document.getElementById('editorModal').classList.add('active');
      if (articleId && articlesData[articleId]) {
        const item = articlesData[articleId];
        document.getElementById('editorModalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Редактировать Статью`;
        document.getElementById('editArticleId').value = item.id;
        document.getElementById('editTitle').value = item.title;
        document.getElementById('editCategory').value = item.category;
        document.getElementById('editIcon').value = item.icon || 'fa-file-lines';
        document.getElementById('editContent').value = item.content;
        document.getElementById('deleteBtn').style.display = 'inline-flex';
      } else {
        document.getElementById('editorModalTitle').innerHTML = `<i class="fa-solid fa-plus"></i> Добавить Новую Статью`;
        document.getElementById('editArticleId').value = '';
        document.getElementById('editTitle').value = '';
        document.getElementById('editCategory').value = 'pohish';
        document.getElementById('editIcon').value = 'fa-file-lines';
        document.getElementById('editContent').value = '';
        document.getElementById('deleteBtn').style.display = 'none';
      }
      document.getElementById('logOfficer').value = '';
      document.getElementById('logTarget').value = '';
    }

    // Save or Update Article to Realtime DB
    function saveArticle() {
      let id = document.getElementById('editArticleId').value;
      if (!id) {
        id = 'art_' + Date.now();
      }

      const title = document.getElementById('editTitle').value.trim();
      const category = document.getElementById('editCategory').value;
      const icon = document.getElementById('editIcon').value.trim() || 'fa-file-lines';
      const content = document.getElementById('editContent').value;

      if (!title || !content) {
        alert("Заполните заголовок и текст статьи!");
        return;
      }

      // Check for Log entry
      let logs = (articlesData[id] && articlesData[id].logs) ? [...articlesData[id].logs] : [];
      const officer = document.getElementById('logOfficer').value.trim();
      const target = document.getElementById('logTarget').value.trim();

      if (officer) {
        const now = new Date();
        const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        logs.unshift({
          officer: officer,
          target: target || 'Без указания',
          time: timeStr
        });
      }

      const newArticle = { id, title, category, icon, content, logs };

      if (db) {
        db.ref('articles/' + id).set(newArticle)
          .then(() => {
            closeModal('editorModal');
          })
          .catch(err => alert("Ошибка сохранения: " + err.message));
      } else {
        articlesData[id] = newArticle;
        renderArticles();
        closeModal('editorModal');
      }
    }

    // Delete Article
    function deleteCurrentArticle() {
      const id = document.getElementById('editArticleId').value;
      if (!id) return;

      if (confirm("Вы уверены, что хотите удалить эту статью?")) {
        if (db) {
          db.ref('articles/' + id).remove()
            .then(() => closeModal('editorModal'))
            .catch(err => alert("Ошибка удаления: " + err.message));
        } else {
          delete articlesData[id];
          renderArticles();
          closeModal('editorModal');
        }
      }
    }

    // Helper functions
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJsString(str) {
      return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\${/g, '\\${');
    }

    // Filter Listeners
    document.getElementById('searchInput').addEventListener('input', renderArticles);
    document.querySelectorAll('.category-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        renderArticles();
      });
    });

    // Run Initialization
    initDataListener();
  </script>
</html>
